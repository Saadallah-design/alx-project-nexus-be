# Render.yaml - Render Blueprint for Django E-commerce Backend
# This file configures all services needed for deployment

services:
  # Django Web Application
  - type: web
    name: ecommerce-backend
    env: python
    region: oregon
    plan: free
    branch: deploy/render
    buildCommand: "./build.sh"
    startCommand: "cd ecommerce_backend && gunicorn ecommerce_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@ecommerce.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # Celery Worker for Background Tasks
  - type: worker
    name: ecommerce-celery-worker
    env: python
    region: oregon
    plan: free
    branch: deploy/render
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd ecommerce_backend && celery -A ecommerce_backend worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        fromService:
          type: web
          name: ecommerce-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString

databases:
  # PostgreSQL Database
  - name: ecommerce-db
    databaseName: ecommerce_db
    user: ecommerce_user
    plan: free
    region: oregon

  # Redis for Celery
  - name: ecommerce-redis
    plan: free
    region: oregon
